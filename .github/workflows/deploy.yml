name: Deploy Nodepad

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'unnecessary'
          if_key_exists: replace

      - name: Install Cloudflare Client & Run SSH
        run: |
          # Download cloudflared binary on the GitHub runner
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 --output-document=cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          # Inject the tunnel configuration into the runner's SSH configuration
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.SERVER_HOST }}" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
          
          # Install sshpass for password support
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # Connect normally! The ProxyCommand handles the network bridging seamlessly
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd /nodepad
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          export NODE_ENV=production
          git reset --hard origin/main
          git pull
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          npm run build
          pm2 reload nodepad --update-env
          EOF